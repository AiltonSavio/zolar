name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
            programs/header-relay/target
            programs/escrow/target
          key: cargo-${{ hashFiles('Cargo.lock', 'programs/header-relay/Cargo.lock', 'programs/escrow/Cargo.lock') }}
      - name: Install Solana toolchain (cargo build-sbf)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.3.11/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Format
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path programs/header-relay/Cargo.toml --check
          cargo fmt --manifest-path programs/escrow/Cargo.toml --check
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --manifest-path programs/header-relay/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path programs/escrow/Cargo.toml --all-targets -- -D warnings
      - name: SBF build
        run: |
          cargo build-sbf --manifest-path programs/header-relay/Cargo.toml
          cargo build-sbf --manifest-path programs/escrow/Cargo.toml
      - name: Tests (crate and LiteSVM)
        run: cargo test --workspace
      - name: Tests (program unit tests)
        run: |
          cargo test --manifest-path programs/header-relay/Cargo.toml
          cargo test --manifest-path programs/escrow/Cargo.toml

  pczt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/zolar-pczt/target
          key: pczt-${{ hashFiles('crates/zolar-pczt/Cargo.lock') }}
      - name: Format, clippy and tests (zolar-pczt, own workspace)
        run: |
          cargo fmt --manifest-path crates/zolar-pczt/Cargo.toml --check
          cargo clippy --manifest-path crates/zolar-pczt/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path crates/zolar-pczt/Cargo.toml

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: cli-${{ hashFiles('cli/Cargo.lock') }}
      - name: Format, clippy and tests (Payee and Payer CLIs, own workspace)
        run: |
          cargo fmt --manifest-path cli/Cargo.toml --check
          cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path cli/Cargo.toml

  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt
      - name: Generated clients are up to date
        run: |
          pnpm --dir clients/codama install --frozen-lockfile
          pnpm --dir clients/codama generate
          test -z "$(git status --porcelain --untracked-files=all -- clients)"
