[package]
name = "header-relay"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = { version = "=0.10.2", default-features = false, features = ["copy"] }
zcash-header = { path = "../../crates/zcash-header" }

[dev-dependencies]
litesvm = "0.6.1"
solana-sdk = "2.2"
hex = "0.4"
bincode = "1.3"

[features]
no-entrypoint = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(target_arch, values("bpf"))'] }
