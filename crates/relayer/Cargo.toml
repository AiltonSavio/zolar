[package]
name = "zolar-relayer"
version = "0.1.0"
edition = "2021"
publish = false
description = "Relayer: follows the Zcash testnet tip over P2P and keeps a Header Relay on Solana current"
license = "MIT OR Apache-2.0"

[lib]
name = "zolar_relayer"

[[bin]]
name = "zolar-relayer"
path = "src/main.rs"

[dependencies]
header-relay-client = { path = "../../clients/rust" }
zcash-header = { path = "../zcash-header" }
borsh = "1"
base64 = "0.22"
bs58 = "0.5"
num-traits = "0.2"
hex = "0.4"
rand = "0.8"
serde_json = "1"
sha2 = "0.10"
solana-address = "2"
solana-hash = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-message = { version = "3", features = ["bincode"] }
solana-signature = "3"
solana-signer = "3"
solana-transaction = { version = "3", features = ["bincode"] }
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
relay-tests = { path = "../relay-tests" }
litesvm = "0.11"
solana-transaction-error = "3"
solana-address = "2"
solana-instruction = "3"
