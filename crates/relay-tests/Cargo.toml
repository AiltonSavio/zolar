[package]
name = "relay-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "LiteSVM harness and tests for the Header Relay program, driven through the generated client"
license = "MIT OR Apache-2.0"

[dependencies]
header-relay-client = { path = "../../clients/rust" }
litesvm = "0.11"
solana-address = "2"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "3"
solana-signer = "3"
solana-transaction = "3"
solana-transaction-error = "3"
borsh = "1"
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
zcash-header = { path = "../zcash-header" }
header-relay-interface = { path = "../header-relay-interface" }
