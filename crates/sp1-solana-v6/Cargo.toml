[package]
name = "sp1-solana-v6"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT"
description = "SP1 v6.10.0 Groth16 verification using Solana BN254 syscalls"

[dependencies]
groth16-solana = { git = "https://github.com/Lightprotocol/groth16-solana", rev = "ac9d959f9b14479c20c9d4f8168fa4cc47c13071", default-features = false }
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }
solana-blake3-hasher = { version = "=3.1.0", features = ["blake3"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
