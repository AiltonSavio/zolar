[package]
name = "vending-prover"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]

[[bin]]
name = "zolar-vend-prove"
path = "src/main.rs"

[features]
sp1 = ["dep:sp1-sdk"]
native-prove = ["sp1", "sp1-sdk/native-gnark"]

[dependencies]
vending-types = { path = "../vending-types" }
vending-guest = { path = "../vending-guest" }
zolar-claim = { path = "../zolar-claim", default-features = false }
header-relay-interface = { path = "../header-relay-interface" }
zcash_primitives = { version = "=0.31.0-pre.2", default-features = false, features = ["std"] }
zcash_protocol = "=0.11.0-pre.1"
orchard = { version = "=0.16.0", default-features = false }
zcash_note_encryption = "0.5.1"
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bs58 = "0.5"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
prost = "0.13"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
sp1-sdk = { version = "=6.10.0", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[patch.crates-io]


zcash_encoding = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
zcash_transparent = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
equihash = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
