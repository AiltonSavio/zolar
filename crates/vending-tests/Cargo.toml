[package]
name = "vending-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "LiteSVM harness and tests for the Vending program, driven through the generated client"
license = "MIT OR Apache-2.0"

[dependencies]
vending-client = { path = "../../clients/vending-rust" }
vending = { path = "../../programs/vending", features = ["no-entrypoint"] }
header-relay-interface = { path = "../header-relay-interface" }
relay-tests = { path = "../relay-tests" }
litesvm = "0.11"
solana-address = "2"
solana-clock = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "3"
solana-signer = "3"
solana-transaction = "3"
solana-transaction-error = "3"
solana-account = "3"
