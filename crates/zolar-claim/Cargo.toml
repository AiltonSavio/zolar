[package]
name = "zolar-claim"
version = "0.1.0"
edition = "2021"
description = "Off-chain builders for Reveal Claim data: Payment Commitment, transaction Merkle paths and Final Block Tree paths"
license = "MIT OR Apache-2.0"

[features]
default = ["private-claim"]
private-claim = ["dep:groth16-solana", "dep:serde_json", "dep:ark-ff"]

[dependencies]
ark-bn254 = "0.5"
light-poseidon = "0.4"
sha2 = "0.10"
ark-ff = { version = "0.5", optional = true }
serde_json = { version = "1", optional = true }
thiserror = "2"
groth16-solana = { git = "https://github.com/Lightprotocol/groth16-solana", rev = "ac9d959f9b14479c20c9d4f8168fa4cc47c13071", features = ["circom-vk"], optional = true }

[dev-dependencies]
hex = "0.4"
serde_json = "1"

[[test]]
name = "private_claim"
required-features = ["private-claim"]

[[example]]
name = "gen_vk"
required-features = ["private-claim"]
