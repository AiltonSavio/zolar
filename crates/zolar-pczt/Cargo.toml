[package]
name = "zolar-pczt"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Transaction ID and viewing-key output decryption for unsigned Ironwood PCZTs"

[dev-dependencies]
hex = "0.4"
# A mainnet PCZT built from nothing but a fake transparent coin (tests/mainnet.rs); never signed.
pczt = { version = "=0.10.0-pre.2", default-features = false, features = ["zcp-builder", "transparent", "orchard"] }
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
secp256k1 = "0.33"
zcash_primitives = { version = "=0.31.0-pre.2", default-features = false, features = ["transparent-inputs"] }
zcash_transparent = { version = "0.11.0-pre.2", default-features = false, features = ["transparent-inputs"] }

[dependencies]
orchard = { version = "0.16", default-features = false }
pczt = { version = "=0.10.0-pre.2", default-features = false, features = ["signer", "orchard"] }
thiserror = "2"
zcash_keys = { version = "=0.17.0-pre.2", default-features = false, features = ["orchard"] }
zcash_note_encryption = "0.5.1"
zcash_primitives = { version = "=0.31.0-pre.2", default-features = false }
zcash_protocol = "=0.11.0-pre.1"
zip32 = "0.3"

# Standalone: the Zcash dependency tree must not enter the Solana workspace lockfile.
[workspace]

# Same librustzcash revision zcash-devtool is pinned to (NU7 / Ironwood support).
[patch.crates-io]
pczt = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
zcash_address = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
zcash_encoding = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
zcash_keys = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
zcash_transparent = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
equihash = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
